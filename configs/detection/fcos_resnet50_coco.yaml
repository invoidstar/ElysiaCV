_base_: "../_base_/default_runtime.yaml"

run:
  name: fcos_resnet50_coco
  stage: train
  seed: 42
  output_dir: ./outputs/checkpoints/fcos_coco
  test_run: false

model:
  type: fcos
  pretrained_path: null
  loss_weights: {cls: 1.0, reg: 1.0}
  backbone:
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [1, 2, 3, 4]
    frozen_stages: 1
    pool_last: false
  neck:
    type: FPN
    in_channels: [256, 512, 1024, 2048]
    out_channels: 256
    num_outs: 5
  head:
    type: DetHead
    num_classes: 80

data:
  train:
    dataset_name: COCO
    dataset_root: ${COCO_ROOT:-/data/coco}
    split: train2017
    loader:
      batch_size: 16
      num_workers: 4
      prefetch_factor: 2
      pin_memory: true
      persistent_workers: true
      drop_last: false
    transforms:
      - type: LoadImageFromFile
      - type: LoadAnnotations
      - type: Resize
        scale: [1333, 800]
        keep_ratio: true
      - type: RandomFlip
        prob: 0.5
      - type: Normalize
        mean: [123.675, 116.28, 103.53]
        std: [58.395, 57.12, 57.375]
      - type: PackDetInputs
  val:
    dataset_name: COCO
    dataset_root: ${COCO_ROOT:-/data/coco}
    split: val2017
    loader:
      batch_size: 1
      num_workers: 2
      prefetch_factor: 2
      pin_memory: true
      persistent_workers: false
      drop_last: false
    transforms:
      - type: LoadImageFromFile
      - type: LoadAnnotations
      - type: Resize
        scale: [1333, 800]
        keep_ratio: true
      - type: Normalize
        mean: [123.675, 116.28, 103.53]
        std: [58.395, 57.12, 57.375]
      - type: PackDetInputs

engine:
  backend: native
  strategy: ddp
  distributed:
    proc_per_node: 8
    ddp_find_unused_parameters: true
    ddp_broadcast_buffers: false
    ddp_bucket_cap_mb: 64
    ddp_gradient_as_bucket_view: true
    ddp_static_graph: false
  precision:
    mixed_precision: true
    dtype: bfloat16
  compile:
    enabled: false
  optimization:
    gradient_accumulation_steps: 1
    grad_clip_norm: 10.0
    optimizer_zero_grad_set_to_none: true

optim:
  type: SGD
  params:
    lr: 0.02
    momentum: 0.9
    weight_decay: 0.0001

schedule:
  type: MultiStepLR
  steps: 90000
  base_lr: 0.02
  min_lr: 0.0001
  warmup_steps: 500
  params:
    milestones: [60000, 80000]
    gamma: 0.1

tracking:
  log_freq: 50
  wandb:
    enabled: false

eval:
  eval_freq: 5000
  metrics:
    - type: MeanAP
      num_classes: 80
  save_best: mAP
  save_final: true