# FCN ResNet-50 on ADE20K (150 classes)
_base_: [../../models/fcn_r50.yaml, ../../datasets/ade20k.yaml]

run:
  name: fcn_r50_ade20k
  output_dir: ./outputs/checkpoints/fcn_r50_ade20k

model:
  head:
    num_classes: 150  # ADE20K has 150 semantic classes

optim: {type: SGD, params: {lr: 0.01, momentum: 0.9, weight_decay: 0.0005}}
schedule: {type: PolyLR, steps: 40000, base_lr: 0.01, min_lr: 0.0001}
eval: {eval_freq: 4000, metrics: [{type: MeanIoU, num_classes: 150}]}