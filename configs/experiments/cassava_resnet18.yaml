# ResNet-18 on Cassava
_base_:
  - ../_base_/default_runtime.yaml
  - ../models/resnet18.yaml
  - ../datasets/cassava.yaml

run:
  name: cassava_resnet18
  output_dir: ./outputs/checkpoints/cassava_resnet18

data:
  train:
    loader:
      batch_size: 32
  val:
    loader:
      batch_size: 64

eval:
  eval_freq: 1000
  metrics:
    - Accuracy
  save_best: Accuracy
  save_final: true