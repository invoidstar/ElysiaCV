_base_: "../_base_/default_runtime.yaml"

run:
  name: fcn_resnet50_ade20k
  stage: train
  seed: 42
  output_dir: ./work_dirs/fcn_ade20k

model:
  type: fcn
  pretrained_path: null
  backbone:
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [1, 2, 3, 4]
    dilations: [1, 1, 2, 4]
    pool_last: false
  neck:
    type: Identity
  head:
    type: SegHead
    num_classes: 150
    in_channels: 2048
    in_index: 3

data:
  train:
    dataset_name: ADE20K
    dataset_root: ${ADE20K_ROOT:-/data/ade20k}
    split: training
    loader:
      batch_size: 16
      num_workers: 4
      prefetch_factor: 2
      pin_memory: true
      persistent_workers: true
    transforms:
      - type: LoadImageFromFile
      - type: LoadAnnotations
      - type: Resize
        scale: [2048, 512]
        keep_ratio: true
      - type: RandomFlip
        prob: 0.5
      - type: PhotoMetricDistortion
      - type: Normalize
        mean: [123.675, 116.28, 103.53]
        std: [58.395, 57.12, 57.375]
      - type: PackSegInputs
  val:
    dataset_name: ADE20K
    dataset_root: ${ADE20K_ROOT:-/data/ade20k}
    split: validation
    loader:
      batch_size: 1
      num_workers: 2
      prefetch_factor: 2
      pin_memory: true
      persistent_workers: false
    transforms:
      - type: LoadImageFromFile
      - type: LoadAnnotations
      - type: Normalize
        mean: [123.675, 116.28, 103.53]
        std: [58.395, 57.12, 57.375]
      - type: PackSegInputs

engine:
  backend: native
  strategy: ddp
  distributed:
    proc_per_node: 8
    ddp_find_unused_parameters: true
    ddp_broadcast_buffers: false
    ddp_bucket_cap_mb: 64
    ddp_gradient_as_bucket_view: true
  precision:
    mixed_precision: true
    dtype: bfloat16
  compile:
    enabled: false
  optimization:
    gradient_accumulation_steps: 1
    grad_clip_norm: null
    optimizer_zero_grad_set_to_none: true

optim:
  type: SGD
  params:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005

schedule:
  type: CosineAnnealing
  steps: 160000
  base_lr: 0.01
  min_lr: 0.0
  warmup_steps: 1500

tracking:
  log_freq: 50
  wandb:
    enabled: false

eval:
  eval_freq: 4000
  metrics:
    - mIoU
    - mAcc
    - aAcc
  save_best: mIoU
  save_final: true