# Base runtime config — inherited by all task-specific configs.
# All keys are under the structured sections expected by CVConfig.

run:
  seed: 42
  test_run: false

# Engine defaults — proven DDP / DataLoader parameters from ElysiaRobot
engine:
  backend: native
  strategy: ddp
  distributed:
    proc_per_node: 1
    node_count: 1
    ddp_find_unused_parameters: true
    ddp_broadcast_buffers: false
    ddp_bucket_cap_mb: 64
    ddp_gradient_as_bucket_view: true
    ddp_static_graph: false
  precision:
    mixed_precision: true
    dtype: bfloat16
    cudnn_benchmark: true
    allow_tf32: true
  compile:
    enabled: false
    mode: reduce-overhead
  optimization:
    gradient_accumulation_steps: 1
    grad_clip_norm: null
    optimizer_zero_grad_set_to_none: true

# Dataloader defaults — flat keys (Schema B), normalized by config loader
data:
  train:
    batch_size: 32
    num_workers: 2
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: true
    drop_last: false
  val:
    batch_size: 32
    num_workers: 2
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false
    drop_last: false
  test:
    batch_size: 1
    num_workers: 2
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false
    drop_last: false

tracking:
  log_freq: 50
  wandb:
    enabled: false
    project: ElysiaCV
    mode: online

eval:
  eval_freq: 5000
  save_best: null
  save_final: true