# Cassava Leaf Disease Classification (5 classes)
# 17,117 train / 4,280 val images, severe class imbalance (CMD = 61.5%)
#
# Transforms are auto-generated by _build_dataloaders based on model backbone type:
#   MLP → 64×64, simple augment
#   Others → 448×448, rand-crop + color jitter

data:
  train:
    dataset_name: cassava
    dataset_root: /data/hdd3/chuqi/data/cassava
    split: train
    loader:
      num_workers: 4
      prefetch_factor: 2
      pin_memory: true
      persistent_workers: true
      drop_last: false
  val:
    dataset_name: cassava
    dataset_root: /data/hdd3/chuqi/data/cassava
    split: val
    loader:
      num_workers: 2
      prefetch_factor: 2
      pin_memory: true
      persistent_workers: false
      drop_last: false