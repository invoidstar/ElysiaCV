# ADE20K semantic segmentation dataset config
data:
  train:
    type: ADE20KDataset
    root: /data/ADEChallengeData2016
    split: training
    batch_size: 8
    transforms:
      - {type: LoadImageFromFile}
      - {type: Resize, size: [512, 512]}
      - {type: RandomFlip, prob: 0.5}
      - {type: Normalize}
      - {type: PackSegInputs}
  val:
    type: ADE20KDataset
    root: /data/ADEChallengeData2016
    split: validation
    batch_size: 8
    transforms:
      - {type: LoadImageFromFile}
      - {type: Resize, size: [512, 512]}
      - {type: Normalize}
      - {type: PackSegInputs}