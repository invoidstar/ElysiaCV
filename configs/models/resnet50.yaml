# ResNet-50 — standard residual benchmark (23M params)

model:
  type: cassava_resnet50
  pretrained_path: null
  backbone:
    type: ResNet
    depth: 50
    pool_last: true
  head:
    type: LinearClsHead
    num_classes: 5
    in_channels: 2048
    dropout: 0.2

optim:
  type: SGD
  params:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0001

schedule:
  type: CosineAnnealing
  steps: 16050
  base_lr: 0.01
  min_lr: 0.00001
  warmup_steps: 500

engine:
  optimization:
    gradient_accumulation_steps: 1
    grad_clip_norm: null