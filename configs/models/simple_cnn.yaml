# Simple 5-stage plain CNN — no residual connections, pure Conv2d→BN→ReLU→MaxPool
# Best for: lightweight non-residual baseline (10M params)

model:
  type: cassava_simple_cnn
  pretrained_path: null
  backbone:
    type: SimpleCNN
    in_channels: 3
    base_channels: 64
    num_classes: 512
    dropout: 0.3
  head:
    type: LinearClsHead
    num_classes: 5
    in_channels: 512
    dropout: 0.2

optim:
  type: SGD
  params:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0001

schedule:
  type: CosineAnnealing
  steps: 16050
  base_lr: 0.01
  min_lr: 0.00001
  warmup_steps: 500

engine:
  optimization:
    gradient_accumulation_steps: 1
    grad_clip_norm: null