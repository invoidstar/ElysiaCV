# ViT-Base/16 — patch=16, 86M params
# AdamW optimizer with lower LR and weight decay

model:
  type: cassava_vit_b16
  pretrained_path: null
  backbone:
    type: ViT
    variant: vit_b_16
    image_size: 448
    pretrained: false
    frozen_stages: 0
    dropout: 0.1
  head:
    type: LinearClsHead
    num_classes: 5
    in_channels: 768
    dropout: 0.1

optim:
  type: AdamW
  params:
    lr: 0.0003
    weight_decay: 0.05
    betas: [0.9, 0.999]

schedule:
  type: CosineAnnealing
  steps: 16050
  base_lr: 0.0003
  min_lr: 0.000001
  warmup_steps: 1000

engine:
  optimization:
    gradient_accumulation_steps: 2
    grad_clip_norm: 1.0