<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="825" viewBox="0 0 1600 825" fill="none" role="img" aria-labelledby="title desc"><title id="title">ElysiaCV system architecture</title><desc id="desc">Diagram of ElysiaCV layers: YAML configuration, typed config and plan, training engine, model plugins, shared component registry, and pending data adapters. Shared training foundation includes distributed training, checkpoint, metrics and logging.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="840" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFCFF"/><stop offset=".58" stop-color="#F4F6FF"/><stop offset="1" stop-color="#F3FDFC"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1475" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#27335C"/><stop offset="1" stop-color="#504D92"/></linearGradient><marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" stroke="#9EAAC6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif"><rect x="1" y="1" width="1598" height="823" rx="30" fill="url(#bg)" stroke="#DBE3F2" stroke-width="1" /><text x="64" y="62" font-size="18" font-weight="750" fill="#716AF4" letter-spacing="2.8">02  /  ARCHITECTURE</text><text x="64" y="124" font-size="47" font-weight="760" fill="#1A2545" letter-spacing="-1">Configuration → execution → evidence.</text><text x="66" y="169" font-size="23" font-weight="440" fill="#65728F" >Shared contracts and component boundaries, with current integration status shown.</text><rect x="64" y="207" width="455" height="122" rx="18" fill="#FFFFFF" stroke="#DBE2F1" stroke-width="1" /><rect x="82" y="226" width="55" height="45" rx="12" fill="#EAF2FF" stroke="none" stroke-width="1" /><text x="98" y="257" font-size="22" font-weight="760" fill="#4E88E8" >01</text><text x="152" y="258" font-size="25" font-weight="735" fill="#1A2545" >YAML &amp; _base_</text><text x="87" y="299" font-size="17" font-weight="460" fill="#65728F" >Inheritance · overrides · validation</text><rect x="573" y="207" width="455" height="122" rx="18" fill="#FFFFFF" stroke="#DBE2F1" stroke-width="1" /><rect x="591" y="226" width="55" height="45" rx="12" fill="#EEECFF" stroke="none" stroke-width="1" /><text x="607" y="257" font-size="22" font-weight="760" fill="#716AF4" >02</text><text x="661" y="258" font-size="25" font-weight="735" fill="#1A2545" >Resolved Config / Plan</text><text x="596" y="299" font-size="17" font-weight="460" fill="#65728F" >Typed CVConfig · TrainingPlan</text><rect x="1082" y="207" width="454" height="122" rx="18" fill="#FFFFFF" stroke="#DBE2F1" stroke-width="1" /><rect x="1100" y="226" width="55" height="45" rx="12" fill="#E5F8F4" stroke="none" stroke-width="1" /><text x="1116" y="257" font-size="22" font-weight="760" fill="#24A7A4" >03</text><text x="1170" y="258" font-size="25" font-weight="735" fill="#1A2545" >Training Engine</text><text x="1105" y="299" font-size="17" font-weight="460" fill="#65728F" >TrainerLoop · strategies · hooks</text><path d="M521 269H563" stroke="#9EAAC6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><path d="M1030 269H1072" stroke="#9EAAC6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><path d="M801 330V371H294V392" stroke="#B2BCD4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><path d="M801 330V392" stroke="#B2BCD4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><path d="M801 371H1306V392" stroke="#B2BCD4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><rect x="64" y="405" width="472" height="160" rx="18" fill="#F0EEFF" stroke="#DFDBFF" stroke-width="1" /><text x="88" y="443" font-size="17" font-weight="740" fill="#716AF4" letter-spacing="1.3">MODEL PLUGINS</text><text x="88" y="486" font-size="21" font-weight="640" fill="#1A2545" >Classification · Detection · Segmentation</text><text x="88" y="527" font-size="21" font-weight="480" fill="#65728F" >plugin.py + runtime.py</text><rect x="564" y="405" width="472" height="160" rx="18" fill="#EDF4FF" stroke="#D7E5FA" stroke-width="1" /><text x="588" y="443" font-size="17" font-weight="740" fill="#4E88E8" letter-spacing="1.3">SHARED REGISTRY</text><text x="588" y="486" font-size="24" font-weight="650" fill="#1A2545" >Backbone · Neck · Head</text><text x="588" y="527" font-size="20" font-weight="480" fill="#65728F" >Loss · Metric · Optimizer · Hook</text><rect x="1064" y="405" width="472" height="160" rx="18" fill="#F3FAF9" stroke="#C9E6E4" stroke-width="2" stroke-dasharray="10 8"/><text x="1088" y="443" font-size="17" font-weight="740" fill="#24A7A4" letter-spacing="1.3">DATA ADAPTERS</text><text x="1088" y="486" font-size="22" font-weight="640" fill="#1A2545" >Dataset · Loader · Transforms</text><text x="1088" y="527" font-size="19" font-weight="610" fill="#24A7A4" >Integration pending in current tree</text><rect x="64" y="622" width="1472" height="111" rx="20" fill="url(#dark)" stroke="none" stroke-width="1" /><text x="93" y="665" font-size="17" font-weight="760" fill="#B5BBFF" letter-spacing="1.7">EXECUTION FOUNDATION</text><text x="93" y="704" font-size="26" font-weight="600" fill="#FFFFFF" >DDP  ·  Grad accumulation  ·  Checkpoints  ·  Logging  ·  Metrics</text><text x="68" y="787" font-size="19" font-weight="480" fill="#65728F" >Module architecture diagram · not a claim that every task already runs end-to-end.</text></g></svg>