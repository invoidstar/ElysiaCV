<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="512" viewBox="0 0 1600 512" fill="none" role="img" aria-labelledby="title desc"><title id="title">Experiment workflow</title><desc id="desc">Five stages: configuration, model plugins, forward, optimization, and artifacts. End-to-end task readiness depends on data and model runtime integration.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="840" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFCFF"/><stop offset=".58" stop-color="#F4F6FF"/><stop offset="1" stop-color="#F3FDFC"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1475" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#27335C"/><stop offset="1" stop-color="#504D92"/></linearGradient><marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" stroke="#9EAAC6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif"><rect x="1" y="1" width="1598" height="510" rx="30" fill="url(#bg)" stroke="#DBE3F2" stroke-width="1" /><text x="64" y="62" font-size="18" font-weight="750" fill="#716AF4" letter-spacing="2.8">03  /  EXPERIMENT LIFECYCLE</text><text x="64" y="124" font-size="47" font-weight="760" fill="#1A2545" letter-spacing="-1">From an experiment idea to traceable artifacts.</text><text x="66" y="169" font-size="23" font-weight="440" fill="#65728F" >A shared path for model research, not a certified end-to-end benchmark.</text><rect x="55" y="220" width="285" height="202" rx="18" fill="#FFFFFF" stroke="#DBE2F1" stroke-width="1" /><rect x="75" y="240" width="48" height="48" rx="14" fill="#EEEFFF" stroke="none" stroke-width="1" /><text x="87" y="273" font-size="20" font-weight="760" fill="#716AF4" >01</text><text x="137" y="273" font-size="19" font-weight="750" fill="#1A2545" letter-spacing=".5">CONFIG</text><text x="75" y="334" font-size="21" font-weight="650" fill="#1A2545" >YAML inheritance</text><text x="75" y="373" font-size="18" font-weight="490" fill="#65728F" >Resolved experiment plan</text><path d="M341 323H360" stroke="#9EAAC6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><rect x="367" y="220" width="285" height="202" rx="18" fill="#FFFFFF" stroke="#DBE2F1" stroke-width="1" /><rect x="387" y="240" width="48" height="48" rx="14" fill="#EEEFFF" stroke="none" stroke-width="1" /><text x="399" y="273" font-size="20" font-weight="760" fill="#4E88E8" >02</text><text x="449" y="273" font-size="19" font-weight="750" fill="#1A2545" letter-spacing=".5">MODEL</text><text x="387" y="334" font-size="21" font-weight="650" fill="#1A2545" >Plugin runtime</text><text x="387" y="373" font-size="18" font-weight="490" fill="#65728F" >Backbone · Neck · Head</text><path d="M653 323H672" stroke="#9EAAC6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><rect x="679" y="220" width="285" height="202" rx="18" fill="#FFFFFF" stroke="#DBE2F1" stroke-width="1" /><rect x="699" y="240" width="48" height="48" rx="14" fill="#E5F7F4" stroke="none" stroke-width="1" /><text x="711" y="273" font-size="20" font-weight="760" fill="#24A7A4" >03</text><text x="761" y="273" font-size="19" font-weight="750" fill="#1A2545" letter-spacing=".5">FORWARD</text><text x="699" y="334" font-size="21" font-weight="650" fill="#1A2545" >Task-specific loss</text><text x="699" y="373" font-size="18" font-weight="490" fill="#65728F" >Train / validation step</text><path d="M965 323H984" stroke="#9EAAC6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><rect x="991" y="220" width="285" height="202" rx="18" fill="#FFFFFF" stroke="#DBE2F1" stroke-width="1" /><rect x="1011" y="240" width="48" height="48" rx="14" fill="#EEEFFF" stroke="none" stroke-width="1" /><text x="1023" y="273" font-size="20" font-weight="760" fill="#716AF4" >04</text><text x="1073" y="273" font-size="19" font-weight="750" fill="#1A2545" letter-spacing=".5">OPTIMIZE</text><text x="1011" y="334" font-size="21" font-weight="650" fill="#1A2545" >Loop &amp; hooks</text><text x="1011" y="373" font-size="18" font-weight="490" fill="#65728F" >DDP · scheduler · log</text><path d="M1277 323H1296" stroke="#9EAAC6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arr)"/><rect x="1303" y="220" width="285" height="202" rx="18" fill="#FFFFFF" stroke="#DBE2F1" stroke-width="1" /><rect x="1323" y="240" width="48" height="48" rx="14" fill="#EEEFFF" stroke="none" stroke-width="1" /><text x="1335" y="273" font-size="20" font-weight="760" fill="#4E88E8" >05</text><text x="1385" y="273" font-size="19" font-weight="750" fill="#1A2545" letter-spacing=".5">ARTIFACTS</text><text x="1323" y="334" font-size="21" font-weight="650" fill="#1A2545" >Training output</text><text x="1323" y="373" font-size="18" font-weight="490" fill="#65728F" >Checkpoint · metrics</text><text x="65" y="475" font-size="19" font-weight="500" fill="#65728F" >Full task execution still depends on dataset integration, loss/metric completeness and the selected model runtime.</text></g></svg>